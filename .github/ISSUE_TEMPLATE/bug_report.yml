name: 錯誤回報
description: 回報無法操作、畫面跑版、資料未更新或其他錯誤
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感謝回報。請勿張貼密碼、完整電話、學號或未遮蔽的個人資料。
  - type: dropdown
    id: role
    attributes:
      label: 使用介面
      options:
        - 球員端
        - 管理者端
        - 兩者都有
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 問題摘要
      description: 請用一、兩句說明發生了什麼。
      placeholder: 例如：配對後進入比賽畫面時，分數區塊會一直跳動。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
      description: 請從開啟網站開始，依順序列出操作。
      placeholder: |
        1. 登入球員帳號
        2. 報名並等待配對
        3. 點開比分畫面
        4. 連續點擊加分
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 實際結果
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 裝置與瀏覽器
      placeholder: 例如：iPhone 15 / iOS 20 / Safari
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: 發生時間
      description: 可提供大約時間，不需要個人資料。
      placeholder: 例如：2026-10-16 19:30 左右
  - type: textarea
    id: screenshots
    attributes:
      label: 截圖或補充資訊
      description: 附圖前請遮蔽姓名、電話、學號及密碼。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隱私確認
      options:
        - label: 我已確認內容不含密碼、金鑰或未遮蔽的個人資料。
          required: true
